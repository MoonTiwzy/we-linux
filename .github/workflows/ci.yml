name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Headers the window's toolkit builds against
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libfreetype-dev libxkbcommon-dev libwayland-dev
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Build
        run: cargo build --release

  # The script a user runs: we-linux and the renderer flake.lock pins, into a prefix.
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Headers
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libfreetype-dev libxkbcommon-dev libwayland-dev libegl-dev
      - name: Install into a prefix
        run: PREFIX=$RUNNER_TEMP/prefix ./install.sh --no-web
      - name: Both are there, and the renderer is the pinned one
        run: |
          $RUNNER_TEMP/prefix/bin/we-linux --version
          $RUNNER_TEMP/prefix/bin/wepaper --version
          grep -q "$(cat $RUNNER_TEMP/prefix/share/wepaper/revision)" flake.lock
      - name: A second run has nothing to build of the renderer
        run: PREFIX=$RUNNER_TEMP/prefix ./install.sh --no-web | grep "pinned one already"

  # The Nix package builds, and a NixOS VM opens the window under a compositor.
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
      - name: Let the VM use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Build the package
        run: nix build .#default --no-link -L
      - name: The VM test
        run: nix flake check -L
