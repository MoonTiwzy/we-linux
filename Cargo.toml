[workspace]
members = ["ui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# Wayland only: wepaper, which draws the wallpapers, needs Wayland anyway, and the
# X11 half of the windowing library is a third of the dependencies' build time.
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit-wayland", "renderer-software"] }

[package]
name = "we-linux"
description = "Wallpaper Engine workshop browser and library for Linux"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Screen reader support. Off by default: it brings in an accessibility stack and a
# D-Bus implementation, about sixty crates.
accessibility = ["slint/accessibility", "we-linux-ui/accessibility"]

[dependencies]
we-linux-ui = { path = "ui" }
slint.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }

[profile.release]
strip = true

# The interface's generated code is glue between properties; what draws is in the
# toolkit, which is optimised as usual. Optimising the glue buys nothing that could be
# measured (the window starts in the same CPU time either way) and was most of a
# release build.
[profile.release.package.we-linux-ui]
opt-level = 0
codegen-units = 256
